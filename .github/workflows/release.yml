name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Stage npm packages
        run: node scripts/stage-npm.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out dist/npm
      - name: Publish to npm
        run: |
          for dir in \
            dist/npm/tori-cli-linux-x64 \
            dist/npm/tori-cli-linux-arm64 \
            dist/npm/tori-cli-darwin-x64 \
            dist/npm/tori-cli-darwin-arm64 \
            dist/npm/tori-cli-win32-x64 \
            dist/npm/tori-cli-win32-arm64 \
            dist/npm/tori-switch
          do
            echo "Publishing $dir..."
            (cd "$dir" && npm publish --access public)
          done
